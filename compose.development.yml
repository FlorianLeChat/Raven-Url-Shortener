name: raven-url-shortener

services:
    cache:
        image: valkey/valkey:8
        command: >
            --requirepass ${CACHE_PASSWORD}
            --maxmemory 128mb
            --maxmemory-policy allkeys-lru
        volumes:
            - valkey_data:/data
        environment:
            TZ: ${TZ}
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            retries: 3
            timeout: 5s
            start_period: 30s

    database:
        image: postgres:18
        volumes:
            - postgres_data:/var/lib/postgresql/18/docker
        environment:
            TZ: ${TZ}
            POSTGRES_DB: ${DATABASE_NAME}
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${DATABASE_USERNAME} -d $${DATABASE_NAME}"]
            retries: 3
            timeout: 5s
            start_period: 30s

    docs:
        image: swaggerapi/swagger-ui:latest
        depends_on:
            server:
                condition: service_healthy
        environment:
            URL: http://localhost:8000/openapi.json
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
            retries: 3
            timeout: 5s
            start_period: 30s
        ports:
            - "8080:8080"

    migration:
        image: raven-url-shortener-backend
        command: >
            sh -c "composer install --no-interaction
            && /usr/local/bin/php bin/console doctrine:database:create --no-interaction --if-not-exists
            && /usr/local/bin/php bin/console doctrine:schema:update --force"
        volumes: &server_volumes
            - ./server:/var/www/html:cached
            - /var/www/html/.git
            - /var/www/html/node_modules
            - cache_data:/var/www/html/var
            - vendor_data:/var/www/html/vendor
        depends_on:
            cache:
                condition: service_healthy
            database:
                condition: service_healthy
        build:
            target: development
            context: ./server
            dockerfile: ./docker/Dockerfile

    scheduler:
        image: raven-url-shortener-backend
        command: /usr/local/bin/php bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=96M
        volumes: *server_volumes
        depends_on:
            cache:
                condition: service_healthy
            migration:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD-SHELL", "find /tmp/scheduler.heartbeat -mmin -2 | grep -q ."]
            retries: 3
            timeout: 5s
            start_period: 30s

    server:
        image: raven-url-shortener-backend
        command: symfony server:start --allow-all-ip
        volumes: *server_volumes
        depends_on:
            cache:
                condition: service_healthy
            migration:
                condition: service_completed_successfully
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/"]
            retries: 3
            timeout: 5s
            start_period: 30s
        build:
            target: development
            context: ./server
            dockerfile: ./docker/Dockerfile
        ports:
            - "8000:8000"

volumes:
    cache_data:
    valkey_data:
    vendor_data:
    postgres_data:
