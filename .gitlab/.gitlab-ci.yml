stages:
    - cache
    - lint
    - test
    - build
    - analyze
    - deploy

default:
    cache:
        key:
            files:
                - composer.lock
                - package-lock.json
        paths:
            - .npm
            - .composer/cache
        policy: pull-push

variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer/cache"

cache:npm:
    image: node:22-alpine
    stage: cache
    script:
        - cd client
        - npm ci --cache .npm --prefer-offline --no-audit

cache:composer:
    image: php:8.2-cli-alpine
    stage: cache
    script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - cd server
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts

lint:eslint:
    stage: lint
    image: node:22-alpine
    before_script:
        - cd client
        - npm ci --cache .npm --prefer-offline --no-audit
    script:
        - npm run lint
    artifacts:
        when: always
        reports:
            codequality: client/gl-codequality.json
        expire_in: 1 hour

lint:phpcs:
    image: php:8.2-cli-alpine
    stage: lint
    before_script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - cd server
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
    script:
        - vendor/bin/phpcs -s

lint:phpstan:
    image: php:8.2-cli-alpine
    stage: lint
    before_script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - cd server
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
        - php bin/console cache:warmup
    script:
        - vendor/bin/phpstan analyse --memory-limit=-1 --error-format=gitlab | tee phpstan-report.json
    artifacts:
        when: always
        reports:
            codequality: server/phpstan-report.json
        expire_in: 1 hour

lint:phpmd:
    image: php:8.2-cli-alpine
    stage: lint
    before_script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - cd server
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
    script:
        - vendor/bin/phpmd src gitlab phpmd.xml | tee phpmd-report.json
    artifacts:
        when: always
        reports:
            codequality: server/phpmd-report.json
        expire_in: 1 hour

test:phpunit:
    image: php:8.2-cli-alpine
    stage: test
    variables:
        XDEBUG_MODE: coverage
    before_script:
        - apk add --no-cache unzip
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip bcmath intl xdebug @composer
        - cd server
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
        - mkdir var
        - touch var/data.db
        - php bin/console --env=test doctrine:schema:create --no-interaction
        - php bin/console --env=test doctrine:fixtures:load --no-interaction
    script:
        - vendor/bin/phpunit -c phpunit.xml --coverage-text --coverage-clover=coverage.xml --colors=never --log-junit phpunit-report.xml
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
    artifacts:
        when: always
        paths:
            - server/coverage.xml
            - server/phpunit-report.xml
        reports:
            junit: server/phpunit-report.xml
        expire_in: 1 hour

.build:project:
    stage: build
    image: alpine:3
    before_script:
        - export VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
        - apk add --no-cache zip
        - mv $CLIENT_ENV_FILE client/.env
        - echo "" >> client/.env
        - echo "NEXT_PUBLIC_VERSION=${VERSION}" >> client/.env
        - echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH}" >> client/.env
        - cp client/.env .env
        - echo "" >> .env
        - mv $SERVER_ENV_FILE server/.env
        - echo "" >> server/.env
        - echo "VERSION=${VERSION}" >> server/.env
        - cat server/.env >> .env
        - echo "" >> .env
        - echo "VERSION=${VERSION}" >> .env
        - echo "ENV_NAME=${CI_ENVIRONMENT_NAME}" >> .env
    script:
        - mv client/docker/configuration/varnish.vcl varnish.vcl
        - mv compose.production.yml compose.yml
        - zip -r project.zip .env compose.yml varnish.vcl
    artifacts:
        paths:
            - .env
            - client/.env
            - server/.env
            - .gitlab/ansible/
            - compose.yml
            - varnish.vcl
            - project.zip
        access: none
        expire_in: 1 hour
    dependencies: []

build:project:test:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH
          when: manual
    extends: .build:project
    variables:
        BASE_PATH: "/url"
    environment:
        name: test
        action: prepare

build:project:production:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: manual
    extends: .build:project
    variables:
        BASE_PATH: ""
    environment:
        name: production
        action: prepare

.build:docker:
    stage: build
    image: docker:29
    services:
        - docker:29-dind-rootless
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
    script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
        - docker compose build
        - docker compose push

build:docker:test:
    needs:
        - build:project:test
    extends: .build:docker

build:docker:production:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: on_success
    needs:
        - build:project:production
    extends: .build:docker

analyze:sast:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/semgrep
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:iac:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/kics
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:secret-detection:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/secrets
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-secret-detection-report.json
        reports:
            secret_detection: gl-secret-detection-report.json
        expire_in: 1 hour
    dependencies: []

analyze:docker-container:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning
    script:
        - export CS_DOCKERFILE_PATH="${DOCKER_FILE}"
        - export CI_APPLICATION_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}-test"
        - export CI_APPLICATION_REPOSITORY="${CI_REGISTRY_IMAGE}/${REALMS}"
        - gtcs scan
    parallel:
        matrix:
            - REALMS: ui
              DOCKER_FILE: client/docker/Dockerfile
            - REALMS: api
              DOCKER_FILE: server/docker/Dockerfile
    artifacts:
        access: developer
        paths:
            - gl-container-scanning-report.json
        reports:
            container_scanning: gl-container-scanning-report.json
        expire_in: 1 hour
    dependencies: []

.deploy:ansible:
    stage: deploy
    image: alpine:3
    variables:
        GIT_STRATEGY: none
    resource_group: $CI_ENVIRONMENT_NAME
    before_script:
        - apk add --no-cache openssl openssh-client ansible
        - eval $(ssh-agent -s)
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan -H 10.0.0.22 >> ~/.ssh/known_hosts
        - echo $ANSIBLE_VAULT_PASSWORD > .vault_password.txt
    script:
        - ansible-playbook -i .gitlab/ansible/hosts.yml --vault-password-file .vault_password.txt -e "application_path=$APPLICATION_PATH" .gitlab/ansible/deploy.yml

deploy:test:
    extends: .deploy:ansible
    variables:
        APPLICATION_PATH: "/var/www/internal.florian-dev.fr/url"
    environment:
        name: test
        url: https://internal.florian-dev.fr/url/
    dependencies:
        - build:project:test

deploy:production:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: on_success
    extends: .deploy:ansible
    variables:
        APPLICATION_PATH: "/var/www/url.florian-dev.fr"
    environment:
        name: production
        url: https://url.florian-dev.fr
    dependencies:
        - build:project:production
