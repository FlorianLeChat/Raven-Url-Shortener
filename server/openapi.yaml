openapi: 3.0.3
info:
    title: 'Raven Url Shortener'
    version: '${VERSION}'
    contact:
        name: 'Webmaster'
        email: 'contact@florian-dev.fr'
        url: 'https://url.florian-dev.fr'
    license:
        name: MIT
        url: 'https://opensource.org/licenses/MIT'
    description: |
        Documentation of the Raven Url Shortener API.

        **By using this service, you accept our [legal notice](https://url.florian-dev.fr/legal).**

        Rate limiting enabled: **${RATE_LIMIT_ENABLED}**. When it is, each IP address can send
        **${RATE_LIMIT_READ_API} read requests** and **${RATE_LIMIT_WRITE_API} write requests** per minute.
        These limits may change with the use and the load of the service. To raise them for your own use,
        contact an administrator at `contact@florian-dev.fr`.

        # Getting started

        Every request and response body is JSON, so send the `Content-Type: application/json` header.
        A link is reached by its UUID or by its slug: `/v1/link/0196cb17-b0f8-7e9c-b381-ef17aa05f3d9`
        and `/v1/link/my-link` target the same resource.

        ```shell
        curl -X POST https://api.url.florian-dev.fr/v1/link \
            -H "Content-Type: application/json" \
            -d '{"url": "https://www.example.org/a/very/long/path", "api-management": true}'
        ```

        # Authentication

        The `Authorization` HTTP header carries different secrets, depending on the endpoint:

        - **API key** (`Authorization: Bearer <key>`): created with the link when `api-management` is
          `true`, and returned only once, in the response creating the link. Store it: it cannot be read
          again. It is required to update or delete the link.
        - **Link password** (`Authorization: Password <password>`): required to read the details of a link
          protected by a password.
        - **Administrator API key** (`Authorization: Bearer <key>`): required by the administrator endpoints,
          such as the review of a report, whether the API is private or public. Sent to any endpoint, it
          replaces the private API key, the password and the API key of a link, skips the CAPTCHA and is not
          counted by the rate limiter. A link locked by a pending report still waits for its review.

        The **private API key** travels in its own header, `X-Api-Key: <key>`. When the server runs as
        a private API with a key, every request must send it from an allowed origin, beside the secret
        of the endpoint, unless it sends the administrator API key.

        An endpoint answers `400` to an `Authorization` header it does not read, unless it carries the
        administrator API key, and an API without private API key answers `400` to the `X-Api-Key` header.
        Reading a link without password refuses a password the same way.

        # CAPTCHA

        A private API also requires a solved [ALTCHA](https://altcha.org/) proof of work challenge on the
        link creation and report requests. Get a challenge from `GET /v1/captcha`, find the `number` whose
        SHA-256 hash of `salt` + `number` equals `challenge` (as `altcha-lib` does), then send the JSON object
        `{algorithm, challenge, number, salt, signature}` encoded in base64 in the `captcha` body field.
        A challenge expires after 60 seconds and its solution is accepted only once. A public API, and a request
        sending the administrator API key, require no CAPTCHA: the field is then ignored.

        # Errors

        Every error returns a JSON body with the HTTP status `code` and a `message`.
        A `400` validation error adds `errors`, the violations grouped by field: each one gives a
        machine-readable `code`, the rejected `value` and a `message`.

        Messages are translated according to the `Accept-Language` header: `en` (default) or `fr`.
        The `Content-Language` response header gives the language used.

        # Rate limiting

        When the rate limit of your IP address is reached, the API returns `429` with these headers.
        The requests sending the administrator API key are not counted.

        - `Retry-After`: seconds to wait before the next request;
        - `X-RateLimit-Limit`: number of requests allowed in the window;
        - `X-RateLimit-Remaining`: number of requests left in the window;
        - `X-RateLimit-Reset`: Unix timestamp when the window resets.

        # Dates

        Dates are serialized as PHP date objects: the local `date`, its `timezone_type`
        and its `timezone` name, for example
        `{"date": "2026-11-28 09:06:10.000000", "timezone_type": 3, "timezone": "Europe/Paris"}`.
servers:
    -   url: 'https://api.url.florian-dev.fr'
        description: 'Public API'
    -   url: 'https://internal.florian-dev.fr/url-api'
        description: 'Private API'
    -   url: 'http://localhost:8000'
        description: 'Local API'
tags:
    -   name: Server
        description: 'Health of the API server.'
    -   name: Link
        description: >-
            Short links: creation, reading and management. Updating or deleting a link requires the API key
            returned by its creation.
    -   name: Slug
        description: 'Custom slugs, the readable part of a short link URL.'
    -   name: Captcha
        description: 'Proof of work challenges required by the write requests of a private API.'
    -   name: Report
        description: >-
            Reports of malicious links. A link with a pending report is locked until an administrator
            accepts or rejects the report.
paths:
    /:
        get:
            tags:
                - Server
            operationId: getServerHealth
            summary: 'Check the server health'
            description: >-
                Check if the server is running and get its version and response time.
                This endpoint is used as the health check of the Docker container.
            security: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: 'curl https://api.url.florian-dev.fr/'
            responses:
                '200':
                    description: 'Server is running'
                    content:
                        text/plain:
                            schema:
                                type: string
                            example: |
                                Version: 1.4.2.
                                Server is running. Response time: 12.345 ms.
                                Ready to handle requests.
                '400':
                    $ref: '#/components/responses/UnexpectedAuthorization'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    /v1/slug:
        post:
            tags:
                - Slug
            operationId: checkSlug
            summary: 'Check slug availability'
            description: >-
                Check if a custom slug is still free before creating a link with it.
                The answer is only a hint: another link can take the slug before yours is created.
            security: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: |
                        curl -X POST https://api.url.florian-dev.fr/v1/slug \
                            -H "Content-Type: application/json" \
                            -d '{"slug": "my-link"}'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - slug
                            properties:
                                slug:
                                    type: string
                                    description: 'The slug to check for availability.'
                        example:
                            slug: my-link
            responses:
                '200':
                    description: 'Slug availability'
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - available
                                properties:
                                    available:
                                        type: boolean
                                        description: 'True if the slug is available, false otherwise.'
                            examples:
                                available:
                                    summary: 'Slug available'
                                    value:
                                        available: true
                                taken:
                                    summary: 'Slug already used'
                                    value:
                                        available: false
                '400':
                    $ref: '#/components/responses/UnexpectedAuthorization'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    /v1/captcha:
        get:
            tags:
                - Captcha
            operationId: getCaptchaChallenge
            summary: 'Get a CAPTCHA challenge'
            description: >-
                Get a new ALTCHA challenge to solve before creating or reporting a link on a private API.
                The challenge expires after 60 seconds and is never stored by a cache. A public API requires
                no CAPTCHA and answers `404`.
            security: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: 'curl https://internal.florian-dev.fr/url-api/v1/captcha'
            responses:
                '200':
                    description: 'Challenge to solve'
                    headers:
                        Cache-Control:
                            schema:
                                type: string
                            example: 'no-store, private'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CaptchaChallenge'
                            example:
                                algorithm: SHA-256
                                challenge: 43f208e0e54d56a0f93aebd4b25fa746681f46cb057cb98c748bf5521d603294
                                maxnumber: 100000
                                salt: '3fe7e8d3a8744a66e556dd53?expires=1795869558&'
                                signature: 07c4e0b1475b4b1d3df2c7c9ba65c45fca15fbd6959fa44d61957b7ae3e0f265
                '404':
                    description: 'The API is public and requires no CAPTCHA'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 404
                                message: 'The requested resource was not found.'
                '400':
                    $ref: '#/components/responses/UnexpectedAuthorization'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    /v1/link:
        post:
            tags:
                - Link
            operationId: createLink
            summary: 'Create a new short link'
            description: |
                Create a new short link, with optional custom slug, password and expiration date.

                Before saving the link, the API requests the target URL: it must answer with a `200` status,
                following at most one redirection. A target protected by a firewall or a bot challenge
                is accepted. Private network addresses are refused.

                When `api-management` is `true`, the response holds the `apiKey` managing the link.
                **It is returned only in this response**: store it to update or delete the link later.

                A private API also requires a solved CAPTCHA challenge in the `captcha` field.
            security: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: |
                        curl -X POST https://api.url.florian-dev.fr/v1/link \
                            -H "Content-Type: application/json" \
                            -d '{"url": "https://www.example.org/a/very/long/path", "slug": "my-link"}'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - url
                            properties:
                                url:
                                    $ref: '#/components/schemas/LinkUrl'
                                slug:
                                    $ref: '#/components/schemas/LinkSlug'
                                password:
                                    $ref: '#/components/schemas/LinkPassword'
                                expiration:
                                    $ref: '#/components/schemas/LinkExpiration'
                                api-management:
                                    type: boolean
                                    default: false
                                    description: >-
                                        Generates an API key to manage the link, returned only in this response.
                                captcha:
                                    $ref: '#/components/schemas/CaptchaSolution'
                        examples:
                            minimal:
                                summary: 'URL only, random slug'
                                value:
                                    url: 'https://www.example.org/a/very/long/path'
                            customSlug:
                                summary: 'Custom slug'
                                value:
                                    url: 'https://www.example.org/a/very/long/path'
                                    slug: my-link
                            protected:
                                summary: 'Password and expiration date'
                                value:
                                    url: 'https://www.example.org/a/very/long/path'
                                    password: 'correct horse battery staple'
                                    expiration: '2027-06-30T23:59:59+02:00'
                            managed:
                                summary: 'With an API key to manage the link'
                                value:
                                    url: 'https://www.example.org/a/very/long/path'
                                    slug: my-link
                                    api-management: true
            responses:
                '201':
                    description: 'Link created successfully'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Link'
                            examples:
                                created:
                                    summary: 'Link without API key'
                                    value:
                                        id: 0196cb17-b0f8-7e9c-b381-ef17aa05f3d9
                                        url: 'https://www.example.org/a/very/long/path'
                                        slug: FMQKolPRcGo6K
                                        apiKey: null
                                        enabled: true
                                        trusted: false
                                        reported: false
                                        createdAt:
                                            date: '2026-11-28 09:06:10.154645'
                                            timezone_type: 3
                                            timezone: Europe/Paris
                                        updatedAt: null
                                        visitedAt: null
                                        expiresAt: null
                                managed:
                                    summary: 'Link with its API key'
                                    value:
                                        id: 0196cb17-b0f8-7e9c-b381-ef17aa05f3d9
                                        url: 'https://www.example.org/a/very/long/path'
                                        slug: my-link
                                        apiKey: kY3n0QwV8pZ2rT5uX7aB9cD1eF4gH6jL0mN2oP8qR3s=
                                        enabled: true
                                        trusted: false
                                        reported: false
                                        createdAt:
                                            date: '2026-11-28 09:06:10.154645'
                                            timezone_type: 3
                                            timezone: Europe/Paris
                                        updatedAt: null
                                        visitedAt: null
                                        expiresAt: null
                '400':
                    $ref: '#/components/responses/ValidationFailed'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
                '503':
                    $ref: '#/components/responses/CaptchaUnavailable'
    /v1/link/{link}:
        parameters:
            -   $ref: '#/components/parameters/Link'
        get:
            tags:
                - Link
            operationId: getLink
            summary: 'Get the details of a short link'
            description: |
                Get the details of a short link by its UUID or its custom slug. Call it before redirecting
                a visitor to the target URL.

                - An expired link returns `410`, even with the right password.
                - A link protected by a password requires the `Authorization: Password <password>` header.
                - A disabled or reported link is still returned: check `enabled` and `reported`
                  before redirecting.

                The request records the visit, at most once a day. The `visitedAt` field of the response
                holds the date of the visit before this one.
            security:
                -   {}
                -   PasswordAuth: []
                -   AdminApiKeyAuth: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: 'curl https://api.url.florian-dev.fr/v1/link/my-link'
                -   lang: Shell
                    label: 'cURL (password)'
                    source: |
                        curl https://api.url.florian-dev.fr/v1/link/my-link \
                            -H "Authorization: Password correct horse battery staple"
            responses:
                '200':
                    description: 'Link details retrieved successfully'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Link'
                            example:
                                id: 0196cb17-b0f8-7e9c-b381-ef17aa05f3d9
                                url: 'https://www.example.org/a/very/long/path'
                                slug: my-link
                                apiKey: null
                                enabled: true
                                trusted: false
                                reported: false
                                createdAt:
                                    date: '2026-11-28 09:06:10.154645'
                                    timezone_type: 3
                                    timezone: Europe/Paris
                                updatedAt: null
                                visitedAt:
                                    date: '2026-11-29 18:42:03.512908'
                                    timezone_type: 3
                                    timezone: Europe/Paris
                                expiresAt:
                                    date: '2027-06-30 23:59:59.000000'
                                    timezone_type: 3
                                    timezone: Europe/Paris
                '400':
                    description: 'Password sent to a link without one, or unexpected "Authorization" header'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 400
                                message: >-
                                    The specified shortcut link is not protected by a password.
                                    Please remove the "Authorization" HTTP header.
                '401':
                    description: 'Link password required'
                    headers:
                        WWW-Authenticate:
                            schema:
                                type: string
                                enum:
                                    - Password
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 401
                                message: >-
                                    The specified shortcut link is protected by a password.
                                    Please provide it in the "Authorization" HTTP header.
                '403':
                    description: 'Link password incorrect'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 403
                                message: >-
                                    The password you provided for the shortcut link is invalid.
                                    Please check it and try again.
                '404':
                    $ref: '#/components/responses/LinkNotFound'
                '410':
                    description: 'Link expired'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 410
                                message: 'The specified shortcut link has expired.'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        put:
            tags:
                - Link
            operationId: replaceLink
            summary: 'Update several fields of a short link'
            description: |
                Update several fields of a short link at once, by its UUID or its custom slug.
                A field left out keeps its current value; an empty `password` or `expiration`
                removes the option.

                The target URL is checked again, as on creation. A disabled or reported link cannot be updated.

                Setting `api-management` to `false` deletes the API key: **the link can then never be
                updated or deleted again**.
            security:
                -   ApiKeyAuth: []
                -   AdminApiKeyAuth: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: |
                        curl -X PUT https://api.url.florian-dev.fr/v1/link/my-link \
                            -H "Authorization: Bearer kY3n0QwV8pZ2rT5uX7aB9cD1eF4gH6jL0mN2oP8qR3s=" \
                            -H "Content-Type: application/json" \
                            -d '{"url": "https://www.example.org/new/path", "slug": "my-new-link"}'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                url:
                                    $ref: '#/components/schemas/LinkUrl'
                                slug:
                                    $ref: '#/components/schemas/LinkSlug'
                                password:
                                    $ref: '#/components/schemas/LinkPassword'
                                expiration:
                                    $ref: '#/components/schemas/LinkExpiration'
                                api-management:
                                    type: boolean
                                    default: true
                                    description: >-
                                        Set to false to delete the API key: the link can then no longer be managed.
                        examples:
                            target:
                                summary: 'New target URL and slug'
                                value:
                                    url: 'https://www.example.org/new/path'
                                    slug: my-new-link
                            removeOptions:
                                summary: 'Remove the password and the expiration date'
                                value:
                                    password: ''
                                    expiration: ''
                            release:
                                summary: 'Delete the API key for good'
                                value:
                                    api-management: false
            responses:
                '200':
                    $ref: '#/components/responses/LinkUpdated'
                '400':
                    $ref: '#/components/responses/ValidationFailed'
                '401':
                    $ref: '#/components/responses/ApiKeyMissing'
                '403':
                    $ref: '#/components/responses/ManagementForbidden'
                '404':
                    $ref: '#/components/responses/LinkNotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        patch:
            tags:
                - Link
            operationId: patchLink
            summary: 'Update one field of a short link'
            description: |
                Update a single field of a short link, by its UUID or its custom slug.
                Unlike the `PUT` request, the expiration date field is named `expiresAt`.

                The target URL is checked again, as on creation. A disabled or reported link cannot be updated.
                An unknown `field` returns `400` without `errors`.
            security:
                -   ApiKeyAuth: []
                -   AdminApiKeyAuth: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: |
                        curl -X PATCH https://api.url.florian-dev.fr/v1/link/my-link \
                            -H "Authorization: Bearer kY3n0QwV8pZ2rT5uX7aB9cD1eF4gH6jL0mN2oP8qR3s=" \
                            -H "Content-Type: application/json" \
                            -d '{"field": "url", "value": "https://www.example.org/new/path"}'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - field
                                - value
                            properties:
                                field:
                                    type: string
                                    enum:
                                        - url
                                        - slug
                                        - password
                                        - expiresAt
                                    description: 'The field to update.'
                                value:
                                    type: string
                                    description: >-
                                        The new value of the field, with the same constraints as on link creation.
                        examples:
                            url:
                                summary: 'New target URL'
                                value:
                                    field: url
                                    value: 'https://www.example.org/new/path'
                            slug:
                                summary: 'New slug'
                                value:
                                    field: slug
                                    value: my-new-link
                            password:
                                summary: 'New password'
                                value:
                                    field: password
                                    value: 'another secret passphrase'
                            expiresAt:
                                summary: 'New expiration date'
                                value:
                                    field: expiresAt
                                    value: '2027-06-30T23:59:59+02:00'
            responses:
                '200':
                    $ref: '#/components/responses/LinkUpdated'
                '400':
                    $ref: '#/components/responses/ValidationFailed'
                '401':
                    $ref: '#/components/responses/ApiKeyMissing'
                '403':
                    $ref: '#/components/responses/ManagementForbidden'
                '404':
                    $ref: '#/components/responses/LinkNotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        delete:
            tags:
                - Link
            operationId: deleteLink
            summary: 'Delete a short link'
            description: >-
                Delete a short link by its UUID or its custom slug, with its reports and its API key.
                A disabled or reported link cannot be deleted.
            security:
                -   ApiKeyAuth: []
                -   AdminApiKeyAuth: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: |
                        curl -X DELETE https://api.url.florian-dev.fr/v1/link/my-link \
                            -H "Authorization: Bearer kY3n0QwV8pZ2rT5uX7aB9cD1eF4gH6jL0mN2oP8qR3s="
            responses:
                '204':
                    description: 'Link deleted successfully'
                '401':
                    $ref: '#/components/responses/ApiKeyMissing'
                '403':
                    $ref: '#/components/responses/ManagementForbidden'
                '404':
                    $ref: '#/components/responses/LinkNotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    /v1/link/{link}/report:
        parameters:
            -   $ref: '#/components/parameters/Link'
        post:
            tags:
                - Report
            operationId: reportLink
            summary: 'Create a report for a short link'
            description: |
                Report a malicious short link, by its UUID or its custom slug. Once reported, the link is
                locked until an administrator reviews the report: it can no longer be updated or deleted.

                - A trusted link cannot be reported (`403`).
                - A link accepts 3 pending reports at most (`429`, without rate limit headers).
                - An email address can report the same link only once (`409`), even after the review. Its domain
                  must be able to receive mail.
                - The reporter who leaves an email address receives the outcome of the review, in the language
                  of the `Accept-Language` header of this request (`en` or `fr`).
                - A private API also requires a solved CAPTCHA challenge in the `captcha` field.
            security: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: |
                        curl -X POST https://api.url.florian-dev.fr/v1/link/my-link/report \
                            -H "Content-Type: application/json" \
                            -d '{"reason": "This link leads to a phishing page.", "email": "jane.doe@example.org"}'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - reason
                            properties:
                                reason:
                                    $ref: '#/components/schemas/ReportReason'
                                email:
                                    $ref: '#/components/schemas/ReportEmail'
                                captcha:
                                    $ref: '#/components/schemas/CaptchaSolution'
                        examples:
                            anonymous:
                                summary: 'Anonymous report'
                                value:
                                    reason: 'This link leads to a phishing page.'
                            withEmail:
                                summary: 'Report with a contact email'
                                value:
                                    reason: 'This link leads to a phishing page.'
                                    email: jane.doe@example.org
            responses:
                '201':
                    description: 'Report created successfully'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Report'
                            example:
                                id: 0196cb20-1c4a-7d3e-9f21-5a8b7c6d4e3f
                                link:
                                    id: 0196cb17-b0f8-7e9c-b381-ef17aa05f3d9
                                    url: 'https://www.example.org/a/very/long/path'
                                    slug: my-link
                                    apiKey: null
                                    enabled: true
                                    trusted: false
                                    reported: true
                                    createdAt:
                                        date: '2026-11-28 09:06:10.154645'
                                        timezone_type: 3
                                        timezone: Europe/Paris
                                    updatedAt: null
                                    visitedAt: null
                                    expiresAt: null
                                reason: 'This link leads to a phishing page.'
                                email: jane.doe@example.org
                                status: pending
                                reviewedAt: null
                                createdAt:
                                    date: '2026-11-30 14:21:37.004512'
                                    timezone_type: 3
                                    timezone: Europe/Paris
                                updatedAt: null
                '400':
                    $ref: '#/components/responses/ValidationFailed'
                '403':
                    description: 'Trusted links cannot be reported'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 403
                                message: >-
                                    You cannot report a trusted link. If you think this link is malicious,
                                    please contact an administrator.
                '404':
                    $ref: '#/components/responses/LinkNotFound'
                '409':
                    description: 'Report already exists'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 409
                                message: 'You have already reported this shortcut link, you cannot report it again.'
                '429':
                    description: 'Rate limit exceeded, or maximum number of reports reached'
                    headers:
                        Retry-After:
                            $ref: '#/components/headers/Retry-After'
                        X-RateLimit-Limit:
                            $ref: '#/components/headers/X-RateLimit-Limit'
                        X-RateLimit-Remaining:
                            $ref: '#/components/headers/X-RateLimit-Remaining'
                        X-RateLimit-Reset:
                            $ref: '#/components/headers/X-RateLimit-Reset'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                rateLimit:
                                    summary: 'Rate limit exceeded'
                                    value:
                                        code: 429
                                        message: >-
                                            Too many requests made for the current IP address.
                                            See response headers for more information.
                                maximumReports:
                                    summary: 'Maximum number of reports reached'
                                    value:
                                        code: 429
                                        message: >-
                                            The maximum number of reports for this link has been reached (3).
                                            It cannot be reported again.
                '500':
                    $ref: '#/components/responses/InternalServerError'
                '503':
                    $ref: '#/components/responses/CaptchaUnavailable'
    /v1/report/{report}:
        parameters:
            -   in: path
                name: report
                required: true
                description: 'The UUID v7 of the report.'
                schema:
                    type: string
                    format: uuid
                example: 0196cb20-1c4a-7d3e-9f21-5a8b7c6d4e3f
        patch:
            tags:
                - Report
            operationId: reviewReport
            summary: 'Accept or reject a report'
            description: |
                Close a pending report with the decision of an administrator. Reserved to the administrators:
                the request requires the administrator API key.

                - `accepted`: the link is disabled.
                - `rejected`: the report no longer locks the link, which is released once no other report
                  is pending. With `trusted` set to `true`, the link is also marked as trusted and cannot
                  be reported again. `trusted` is ignored for an accepted report.

                Each report is reviewed once: a report already accepted or rejected returns `409`.
                When the reporter left an email address, they receive the outcome in the language of their report,
                once the response is sent. A failure to send this email does not fail the review.
            security:
                -   AdminApiKeyAuth: []
            x-codeSamples:
                -   lang: Shell
                    label: cURL
                    source: |
                        curl -X PATCH https://api.url.florian-dev.fr/v1/report/0196cb20-1c4a-7d3e-9f21-5a8b7c6d4e3f \
                            -H "Authorization: Bearer <administrator API key>" \
                            -H "Content-Type: application/json" \
                            -d '{"status": "rejected", "trusted": true}'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - status
                            properties:
                                status:
                                    type: string
                                    enum:
                                        - accepted
                                        - rejected
                                    description: 'The decision of the administrator.'
                                trusted:
                                    type: boolean
                                    default: false
                                    description: 'Marks the link as trusted when the report is rejected.'
                        examples:
                            accepted:
                                summary: 'Accept the report and disable the link'
                                value:
                                    status: accepted
                            rejected:
                                summary: 'Reject the report and trust the link'
                                value:
                                    status: rejected
                                    trusted: true
            responses:
                '200':
                    description: 'Report reviewed successfully'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Report'
                            example:
                                id: 0196cb20-1c4a-7d3e-9f21-5a8b7c6d4e3f
                                link:
                                    id: 0196cb17-b0f8-7e9c-b381-ef17aa05f3d9
                                    url: 'https://www.example.org/a/very/long/path'
                                    slug: my-link
                                    apiKey: null
                                    enabled: false
                                    trusted: false
                                    reported: false
                                    createdAt:
                                        date: '2026-11-28 09:06:10.154645'
                                        timezone_type: 3
                                        timezone: Europe/Paris
                                    updatedAt: null
                                    visitedAt: null
                                    expiresAt: null
                                reason: 'This link leads to a phishing page.'
                                email: jane.doe@example.org
                                status: accepted
                                reviewedAt:
                                    date: '2026-12-01 10:02:51.318274'
                                    timezone_type: 3
                                    timezone: Europe/Paris
                                createdAt:
                                    date: '2026-11-30 14:21:37.004512'
                                    timezone_type: 3
                                    timezone: Europe/Paris
                                updatedAt:
                                    date: '2026-12-01 10:02:51.318274'
                                    timezone_type: 3
                                    timezone: Europe/Paris
                '400':
                    description: 'Invalid decision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    status:
                                        -   code: NO_SUCH_CHOICE_ERROR
                                            value: pending
                                            message: 'The value you selected is not a valid choice.'
                '401':
                    $ref: '#/components/responses/ApiKeyMissing'
                '403':
                    description: 'Administrator API key invalid'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 403
                                message: 'The provided API key is invalid. Please check it and try again.'
                '404':
                    description: 'Report not found'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 404
                                message: 'The requested resource was not found.'
                '409':
                    description: 'Report already reviewed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                code: 409
                                message: 'This report has already been reviewed by an administrator.'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
components:
    securitySchemes:
        ApiKeyAuth:
            type: http
            scheme: bearer
            description: >-
                API key returned once, when a link is created with `api-management` set to `true`.
                Send it as `Authorization: Bearer <key>`.
        PasswordAuth:
            type: apiKey
            in: header
            name: Authorization
            description: >-
                Password of a protected link, prefixed by `Password `: `Authorization: Password <password>`.
        AdminApiKeyAuth:
            type: http
            scheme: bearer
            description: >-
                Administrator API key, set by `ADMIN_API_KEY` on the server: required by the administrator
                endpoints of a private or public API. Send it as `Authorization: Bearer <key>`. On any endpoint,
                it replaces the private API key and the secrets of a link, skips the CAPTCHA and the rate limit.
                When the server sets no key, the administrator endpoints refuse every request.
    parameters:
        Link:
            in: path
            name: link
            required: true
            description: 'The UUID v7 or the slug of the link.'
            schema:
                type: string
                pattern: '^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'
            examples:
                uuid:
                    summary: UUID
                    value: 0196cb17-b0f8-7e9c-b381-ef17aa05f3d9
                slug:
                    summary: Slug
                    value: my-link
    headers:
        Retry-After:
            description: 'Seconds to wait before the next request.'
            schema:
                type: integer
            example: 42
        X-RateLimit-Limit:
            description: 'Number of requests allowed in the window.'
            schema:
                type: integer
            example: 30
        X-RateLimit-Remaining:
            description: 'Number of requests left in the window.'
            schema:
                type: integer
            example: 0
        X-RateLimit-Reset:
            description: 'Unix timestamp when the window resets.'
            schema:
                type: integer
            example: 1796036842
    responses:
        LinkUpdated:
            description: 'Link updated successfully'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Link'
                    example:
                        id: 0196cb17-b0f8-7e9c-b381-ef17aa05f3d9
                        url: 'https://www.example.org/new/path'
                        slug: my-new-link
                        apiKey: null
                        enabled: true
                        trusted: false
                        reported: false
                        createdAt:
                            date: '2026-11-28 09:06:10.154645'
                            timezone_type: 3
                            timezone: Europe/Paris
                        updatedAt:
                            date: '2026-12-01 11:15:48.731002'
                            timezone_type: 3
                            timezone: Europe/Paris
                        visitedAt: null
                        expiresAt: null
        ValidationFailed:
            description: 'Data validation failed'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationError'
                    examples:
                        invalidUrl:
                            summary: 'Invalid URL'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    url:
                                        -   code: INVALID_URL_ERROR
                                            value: 'example.org'
                                            message: 'This value is not a valid URL.'
                        unreachableUrl:
                            summary: 'Unreachable URL'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    url:
                                        -   code: UNREACHABLE_URL_ERROR
                                            value: 'https://www.example.org/missing'
                                            message: 'The specified URL is unreachable.'
                        duplicateSlug:
                            summary: 'Slug already used'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    slug:
                                        -   code: DUPLICATE_SLUG_ERROR
                                            value: my-link
                                            message: >-
                                                The custom slug you chose is already used by another link.
                                                Please choose another one.
                        invalidSlug:
                            summary: 'Invalid slug'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    slug:
                                        -   code: REGEX_FAILED_ERROR
                                            value: 'my link!'
                                            message: 'This value is not valid.'
                        expirationOutOfRange:
                            summary: 'Expiration date out of range'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    expiresAt:
                                        -   code: NOT_IN_RANGE_ERROR
                                            value:
                                                date: '2020-01-01 00:00:00.000000'
                                                timezone_type: 3
                                                timezone: Europe/Paris
                                            message: >-
                                                This value should be between Nov 29, 2026, 12:00 AM
                                                and Nov 28, 2027, 9:06 AM.
                        invalidExpiration:
                            summary: 'Expiration date not understood'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    expiresAt:
                                        -   code: INVALID_DATE_ERROR
                                            value: 'next blue moon'
                                            message: 'This value is not a valid date.'
                        reasonTooShort:
                            summary: 'Report reason too short'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    reason:
                                        -   code: TOO_SHORT_ERROR
                                            value: 'Spam'
                                            message: 'This value is too short. It should have 10 characters or more.'
                        undeliverableEmail:
                            summary: 'Report email that cannot receive mail'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    email:
                                        -   code: UNDELIVERABLE_ERROR
                                            value: 'jane.doe@no-mail.example'
                                            message: 'The domain of this email address cannot receive mail.'
                        captchaMissing:
                            summary: 'CAPTCHA solution missing (private API)'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    captcha:
                                        -   code: CAPTCHA_MISSING_ERROR
                                            value: null
                                            message: >-
                                                A solved CAPTCHA challenge is required.
                                                Please provide it in the "captcha" field.
                        captchaInvalid:
                            summary: 'CAPTCHA solution invalid, expired or already used (private API)'
                            value:
                                code: 400
                                message: 'An error occurred during data validation.'
                                errors:
                                    captcha:
                                        -   code: CAPTCHA_INVALID_ERROR
                                            value: null
                                            message: >-
                                                The CAPTCHA solution is invalid, expired or already used.
                                                Please solve a new challenge.
        ApiKeyMissing:
            description: 'API key missing'
            headers:
                WWW-Authenticate:
                    schema:
                        type: string
                        enum:
                            - Bearer
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        code: 401
                        message: 'The API key is missing. Please provide it in the "Authorization" HTTP header.'
        ManagementForbidden:
            description: 'API key invalid, or link disabled or reported'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    examples:
                        invalidApiKey:
                            summary: 'Invalid API key'
                            value:
                                code: 403
                                message: 'The provided API key is invalid. Please check it and try again.'
                        disabled:
                            summary: 'Link disabled'
                            value:
                                code: 403
                                message: >-
                                    The specified shortcut link has been disabled by its owner
                                    or by an administrator.
                        reported:
                            summary: 'Link reported'
                            value:
                                code: 403
                                message: >-
                                    The specified shortcut link has been reported by one or more users.
                                    This link must be verified by an administrator before it can be reached again.
        LinkNotFound:
            description: 'Link not found'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        code: 404
                        message: 'The requested resource was not found.'
        TooManyRequests:
            description: 'Rate limit exceeded'
            headers:
                Retry-After:
                    $ref: '#/components/headers/Retry-After'
                X-RateLimit-Limit:
                    $ref: '#/components/headers/X-RateLimit-Limit'
                X-RateLimit-Remaining:
                    $ref: '#/components/headers/X-RateLimit-Remaining'
                X-RateLimit-Reset:
                    $ref: '#/components/headers/X-RateLimit-Reset'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        code: 429
                        message: >-
                            Too many requests made for the current IP address.
                            See response headers for more information.
        UnexpectedAuthorization:
            description: 'The request sends an "Authorization" header the endpoint does not read'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        code: 400
                        message: 'This endpoint does not read the "Authorization" HTTP header. Please remove it.'
        InternalServerError:
            description: 'Internal server error'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        code: 500
                        message: 'There was an error while processing your request.'
        CaptchaUnavailable:
            description: 'CAPTCHA check unavailable, the database storing the solved challenges cannot be reached'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        code: 503
                        message: 'The CAPTCHA check is temporarily unavailable. Please try again later.'
    schemas:
        DateTime:
            type: object
            description: 'A date serialized as a PHP date object.'
            required:
                - date
                - timezone_type
                - timezone
            properties:
                date:
                    type: string
                    pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{6}$'
                    description: 'The local date and time, with microseconds.'
                    example: '2026-11-28 09:06:10.154645'
                timezone_type:
                    type: integer
                    description: 'The PHP time zone type: 3 for a time zone name.'
                    example: 3
                timezone:
                    type: string
                    description: 'The time zone the date is expressed in.'
                    example: Europe/Paris
        NullableDateTime:
            type: object
            nullable: true
            description: 'A date serialized as a PHP date object, or null when the date is not set.'
            required:
                - date
                - timezone_type
                - timezone
            properties:
                date:
                    $ref: '#/components/schemas/DateTime/properties/date'
                timezone_type:
                    $ref: '#/components/schemas/DateTime/properties/timezone_type'
                timezone:
                    $ref: '#/components/schemas/DateTime/properties/timezone'
        Link:
            type: object
            required:
                - id
                - url
                - slug
                - apiKey
                - enabled
                - trusted
                - reported
                - createdAt
                - updatedAt
                - visitedAt
                - expiresAt
            properties:
                id:
                    type: string
                    format: uuid
                    title: 'The unique identifier of the link'
                    description: 'A UUID v7, usable in place of the slug in `/v1/link/{link}`.'
                url:
                    $ref: '#/components/schemas/LinkUrl'
                slug:
                    $ref: '#/components/schemas/LinkSlug'
                apiKey:
                    type: string
                    nullable: true
                    title: 'The API key of the link, returned only when the link is created'
                    description: >-
                        32 random bytes encoded in base64. Always `null` in the other responses.
                enabled:
                    type: boolean
                    title: 'The activation state of the link'
                    description: 'A disabled link must not redirect its visitors, and cannot be updated or deleted.'
                trusted:
                    type: boolean
                    title: 'The trust state of the link'
                    description: >-
                        True when the target URL belongs to a trusted domain. A trusted link cannot be reported.
                reported:
                    type: boolean
                    title: 'The report state of the link'
                    description: >-
                        True when at least one report of the link waits for an administrator.
                        A reported link cannot be updated or deleted.
                createdAt:
                    allOf:
                        -   $ref: '#/components/schemas/DateTime'
                    title: 'The creation date of the link'
                updatedAt:
                    allOf:
                        -   $ref: '#/components/schemas/NullableDateTime'
                    title: 'The last update date of the link'
                visitedAt:
                    allOf:
                        -   $ref: '#/components/schemas/NullableDateTime'
                    title: 'The last visit date of the link'
                    description: >-
                        Recorded at most once a day. A `GET` request returns the visit before its own.
                expiresAt:
                    allOf:
                        -   $ref: '#/components/schemas/NullableDateTime'
                    title: 'The expiration date of the link'
        LinkUrl:
            type: string
            format: uri
            description: >-
                The URL to shorten, with a top-level domain. It must answer with a `200` status
                (at most one redirection followed).
            example: 'https://www.example.org/a/very/long/path'
        LinkSlug:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9-]+$'
            description: >-
                The custom slug for the short link: letters, digits and dashes.
                When left out on creation, a random slug of 5 to 20 letters and digits is generated.
            example: my-link
        LinkPassword:
            type: string
            maxLength: 255
            description: >-
                The password to protect the short link, stored hashed. An empty string means no password.
            example: 'correct horse battery staple'
        LinkExpiration:
            type: string
            description: >-
                The expiration date for the short link, between tomorrow and one year from now.
                Any date understood by PHP is accepted; prefer ISO 8601 with a time zone offset.
                An empty string means no expiration date.
            example: '2027-06-30T23:59:59+02:00'
        Report:
            type: object
            required:
                - id
                - link
                - reason
                - email
                - status
                - reviewedAt
                - createdAt
                - updatedAt
            properties:
                id:
                    type: string
                    format: uuid
                    title: 'The unique identifier of the report'
                link:
                    $ref: '#/components/schemas/Link'
                reason:
                    $ref: '#/components/schemas/ReportReason'
                email:
                    type: string
                    format: email
                    nullable: true
                    description: 'The email of the reporter, or null for an anonymous report.'
                status:
                    type: string
                    enum:
                        - pending
                        - accepted
                        - rejected
                    title: 'The review state of the report'
                    description: 'A pending report locks its link until an administrator accepts or rejects it.'
                reviewedAt:
                    allOf:
                        -   $ref: '#/components/schemas/NullableDateTime'
                    title: 'The review date of the report'
                createdAt:
                    allOf:
                        -   $ref: '#/components/schemas/DateTime'
                    title: 'The creation date of the report'
                updatedAt:
                    allOf:
                        -   $ref: '#/components/schemas/NullableDateTime'
                    title: 'The last update date of the report'
        ReportReason:
            type: string
            minLength: 10
            maxLength: 500
            description: 'The reason for reporting the link.'
            example: 'This link leads to a phishing page.'
        ReportEmail:
            type: string
            format: email
            minLength: 10
            maxLength: 100
            description: >-
                The email address of the reporter, so an administrator can reply. Its domain must be able
                to receive mail.
            example: jane.doe@example.org
        CaptchaChallenge:
            type: object
            required:
                - algorithm
                - challenge
                - maxnumber
                - salt
                - signature
            properties:
                algorithm:
                    type: string
                    enum:
                        - SHA-256
                    description: 'The hash algorithm of the challenge.'
                challenge:
                    type: string
                    description: 'The hash to find, in hexadecimal.'
                maxnumber:
                    type: integer
                    description: 'The highest number to try.'
                salt:
                    type: string
                    description: 'The salt to prepend to the number, holding the expiration timestamp.'
                signature:
                    type: string
                    description: 'The HMAC signature of the challenge, in hexadecimal.'
        CaptchaSolution:
            type: string
            format: byte
            description: >-
                The solved CAPTCHA challenge, required by a private API and ignored by a public API:
                the JSON object `{algorithm, challenge, number, salt, signature}` encoded in base64.
        Error:
            type: object
            required:
                - code
                - message
            properties:
                code:
                    type: integer
                    description: 'The HTTP status code.'
                message:
                    type: string
                    description: 'The error message, translated according to the Accept-Language header.'
        ValidationError:
            allOf:
                -   $ref: '#/components/schemas/Error'
                -   type: object
                    properties:
                        errors:
                            type: object
                            description: 'The violations, grouped by field name.'
                            additionalProperties:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Violation'
        Violation:
            type: object
            required:
                - code
                - value
                - message
            properties:
                code:
                    type: string
                    description: >-
                        The machine-readable violation code, such as `INVALID_URL_ERROR`, `MISSING_TLD_ERROR`,
                        `UNREACHABLE_URL_ERROR`, `DUPLICATE_SLUG_ERROR`, `REGEX_FAILED_ERROR`, `TOO_SHORT_ERROR`,
                        `TOO_LONG_ERROR`, `NOT_IN_RANGE_ERROR`, `INVALID_DATE_ERROR`, `INVALID_FORMAT_ERROR`,
                        `UNDELIVERABLE_ERROR`, `NO_SUCH_CHOICE_ERROR`, `CAPTCHA_MISSING_ERROR` or
                        `CAPTCHA_INVALID_ERROR`.
                value:
                    description: 'The rejected value.'
                message:
                    type: string
                    description: 'The violation message, translated according to the Accept-Language header.'
